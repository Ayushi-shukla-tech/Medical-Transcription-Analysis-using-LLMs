<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Medical Transcription System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="/static/js/auth.js"></script>
    <style>
        :root {
            --primary-color: #4a86e8;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .navbar {
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            padding: 15px 30px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .navbar .user-info {
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }

        .welcome-text {
            font-weight: 600;
            color: var(--dark-color);
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #eee;
            padding: 20px;
            font-weight: 600;
        }

        .card-body {
            padding: 20px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
        }

        .btn-primary:hover {
            background-color: #3a76d8;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid #e0e0e0;
            font-weight: 600;
            color: var(--secondary-color);
        }

        .table td, .table th {
            padding: 15px;
            vertical-align: middle;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--secondary-color);
        }

        .empty-state i {
            font-size: 40px;
            opacity: 0.4;
            margin-bottom: 12px;
        }
        {% block styles %}{% endblock %}
    </style>
</head>
<body>
    <!-- Sidebar -->
    {% include 'partials/doctor_sidebar.html' %}

    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <div class="navbar">
            <h4 class="mb-0">{% block heading %}{% endblock %}</h4>
            <div class="user-info">
                <div class="user-avatar">
                    {{ user.full_name[0] | upper }}
                </div>
                <div class="welcome-text">
                    Welcome, {% if not user.full_name.startswith('Dr.') %}Dr. {% endif %}{{ user.full_name }}
                </div>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!isLoggedIn() || getUserRole() !== 'doctor') {
                window.location.href = '/';
                return;
            }

            // Keep the auth cookie fresh for server-rendered pages
            setAuthCookie();

            document.getElementById('logoutLink').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });

            // Filter table rows by the search box and optional status dropdown
            const table = document.querySelector('[data-filter-table]');
            const search = document.getElementById('tableSearch');
            const status = document.getElementById('statusFilter');
            const noMatches = document.getElementById('noMatchesRow');
            function applyFilters() {
                if (!table) return;
                const term = (search ? search.value : '').trim().toLowerCase();
                const wanted = status ? status.value : '';
                let shown = 0;
                table.querySelectorAll('tbody tr[data-search]').forEach(row => {
                    const match = row.dataset.search.includes(term) && (!wanted || row.dataset.status === wanted);
                    row.classList.toggle('d-none', !match);
                    if (match) shown++;
                });
                if (noMatches) noMatches.classList.toggle('d-none', shown > 0);
            }
            if (search) search.addEventListener('input', applyFilters);
            if (status) status.addEventListener('change', applyFilters);
        });

        // Format seconds as MM:SS
        function formatDuration(seconds) {
            seconds = Math.round(seconds || 0);
            return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
